name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run Black with an explicit target-version that matches the runner's Python
      - name: Run black
        uses: psf/black@24.8.0
        with:
          args: --check --diff --target-version py313 .